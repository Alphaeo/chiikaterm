# cargo deny check: dependencies' licenses and known vulnerabilities (RustSec), run by CI.

[advisories]
# Every vulnerability, unmaintained or yanked crate fails; an exception needs a reason here.
ignore = []

[licenses]
# Licenses compatible with shipping chiika under MIT OR Apache-2.0, in a company too.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
