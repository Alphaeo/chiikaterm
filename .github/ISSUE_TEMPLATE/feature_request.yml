name: Feature request
description: An idea to make chiika better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The need, before the solution; what you do today without it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
