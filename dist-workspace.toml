[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# SBOM (CycloneDX) of each binary, attached to the release
cargo-cyclonedx = true
# GitHub attests that each artifact was built by this workflow from this commit
github-attestations = true
# Pull requests build every artifact too (downloadable from the run, never published)
pr-run-mode = "upload"

# Windows ARM on a Windows runner: the MSI needs WiX, which Linux runners lack
[dist.github-custom-runners]
aarch64-pc-windows-msvc = "windows-2022"
